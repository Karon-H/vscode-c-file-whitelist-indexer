name: Secret Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  secret-scan:
    name: 🔒 Scan for Secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================================================
      # Gitleaks — 业界标准的 Git 秘密扫描工具
      # 支持: 正则匹配 + 熵检测 + 自定义规则
      # ================================================================
      - name: 🐶 Gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # 自定义关键字扫描（兜底补充）
      # ================================================================
      - name: 🕵️ 自定义敏感关键字扫描
        shell: bash
        run: |
          set -e
          ISSUES=0

          # 扫描所有 tracked 文件（排除 package-lock.json 这类自动生成文件）
          git ls-files | grep -v 'package-lock.json' | while read file; do
            # 二进制文件跳过
            if [[ "$(file -b --mime-encoding "$file" 2>/dev/null)" == "binary" ]]; then
              continue
            fi

            # 检查敏感模式
            if grep -Pn \
              '(?i)(password|passwd|pwd|secret|api[_-]?key|api[_-]?secret|token|auth[_-]?token|access[_-]?key|bearer|private[_-]?key)\s*[:=]\s*[''"][^''"]{8,}[''"]' \
              "$file" 2>/dev/null; then
              echo "::warning file=$file::可能包含敏感信息"
              ISSUES=$((ISSUES + 1))
            fi

            # 检查私钥文件内容
            if grep -q '-----BEGIN.*PRIVATE KEY-----' "$file" 2>/dev/null; then
              echo "::error file=$file::检测到私钥文件内容"
              ISSUES=$((ISSUES + 1))
            fi
          done

          if [ $ISSUES -gt 0 ]; then
            echo "::error::发现 $ISSUES 处敏感信息！请检查并移除后重新提交。"
            exit 1
          fi
          echo "✅ 自定义扫描通过，未发现敏感信息"
