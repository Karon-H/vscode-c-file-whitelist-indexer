# ============================================================================
# Build & Release
# 说明:
#   - 推送 main/master 分支 → 仅 Build（编译打包，上传构建产物验证）
#   - 推送 v* 标签         → Build + 自动创建 GitHub Release，附上 .vsix
# ============================================================================

name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  ###########################################################################
  # BUILD: 编译 + 打包 VSIX（所有 push 事件共用）
  ###########################################################################
  build:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p ./ --noEmit

      - name: Compile
        run: npx tsc -p ./

      - name: Package VSIX
        run: npx vsce package

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: ./*.vsix
          retention-days: 30

  ###########################################################################
  # RELEASE: 仅推标签时触发，自包含构建（不依赖 build job 产物）
  # 为什么要自包含？
  #   git push origin main --tags 推送同一个 commit 时，GitHub Actions
  #   可能只触发一次（分支事件），标签事件的 job 不会运行。独立触发确保
  #   标签推送时一定能完成 build + release。
  ###########################################################################
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p ./ --noEmit

      - name: Compile
        run: npx tsc -p ./

      - name: Package VSIX
        run: npx vsce package

      - name: Determine VSIX filename
        id: vsix
        shell: bash
        run: |
          echo "file=$(ls *.vsix | head -1)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            - 自动构建时间：${{ github.event.repository.updated_at }}
            - 构建编号：${{ github.run_number }}

            ### 安装方式

            1. 下载 `.vsix` 文件
            2. 在 VS Code 中按 `Ctrl+Shift+P` → `Extensions: Install from VSIX...`
            3. 选择下载的 `.vsix` 文件
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true
